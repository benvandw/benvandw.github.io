<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/index.xml' | relative_url }}">
</head>
<body>
  <header class="hero">
    <div class="starfield" aria-hidden="true">
      <span class="star" style="top:16px; left:15%;"></span>
      <span class="star" style="top:34px; left:40%;"></span>
      <span class="star" style="top:20px; left:75%;"></span>
      <span class="star" style="top:48px; left:92%;"></span>
      <span class="star" style="top:60px; left:25%;"></span>
      <span class="star" style="top:70px; left:58%;"></span>
    </div>
    <div class="hero-inner">
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/events' | relative_url }}">Events</a>
        <a href="{{ '/now' | relative_url }}">Now</a>
        <a href="{{ '/index.xml' | relative_url }}">RSS</a>
      </nav>
      {% if page.url == "/" %}
      <div class="hero-text">
        <h1>Welcome Home</h1>
      </div>
      {% elsif page.title %}
      <div class="hero-text">
        <h1>{{ page.title }}</h1>
      </div>
      {% endif %}
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <hr>
    <p>Made with <a href="https://jekyllrb.com">Jekyll</a>, Hosted on GitHub Pages.</p>
  </footer>
</body>
</html>

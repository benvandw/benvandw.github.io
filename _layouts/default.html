<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/index.xml' | relative_url }}">
</head>
<body>
  <header>
    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/events' | relative_url }}">Events</a>
      <a href="{{ '/index.xml' | relative_url }}">RSS</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <hr>
    <p>Made with <a href="https://jekyllrb.com">Jekyll</a>,Hosted on GitHub Pages.</p>
  </footer>
</body>
</html>
